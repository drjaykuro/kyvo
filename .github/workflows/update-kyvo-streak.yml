name: Update KYVO streak rule
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-streak:
    if: contains(github.event.head_commit.message, 'Update KYVO streak rule') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update streak logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/blocksLogic.js')
          s = p.read_text()
          old = '''// Returns dates where every task scheduled for that day was completed.
// A day with no tasks is not considered a completed streak day.
function getCompletedDayDates(tasks) {
  const byDate = new Map()
  const today = todayStr()

  for (const task of tasks) {
    if (!task.date || task.date > today) continue
    if (!byDate.has(task.date)) byDate.set(task.date, [])
    byDate.get(task.date).push(task)
  }

  return new Set(
    [...byDate.entries()]
      .filter(([, dayTasks]) => dayTasks.length > 0 && dayTasks.every((task) => task.done))
      .map(([date]) => date)
  )
}'''
          new = '''// A streak day is earned when the user completes at least 75% of
// the tasks scheduled for that day. This keeps streaks motivating without
// requiring an unrealistically perfect day.
function getCompletedDayDates(tasks) {
  const byDate = new Map()
  const today = todayStr()

  for (const task of tasks) {
    if (!task.date || task.date > today) continue
    if (!byDate.has(task.date)) byDate.set(task.date, [])
    byDate.get(task.date).push(task)
  }

  return new Set(
    [...byDate.entries()]
      .filter(([, dayTasks]) => {
        if (dayTasks.length === 0) return false
        const completed = dayTasks.filter((task) => task.done).length
        return completed / dayTasks.length >= 0.75
      })
      .map(([date]) => date)
  )
}'''
          if old not in s:
              raise SystemExit('Expected streak helper not found')
          s = s.replace(old, new, 1)
          old2 = '''    if (dayTasks.every((t) => t.done)) {
      streak += 1
      currentDay = new Date(currentDay.getTime() - 24 * 60 * 60 * 1000)
    } else if (dayStr === todayString) {'''
          new2 = '''    const completedCount = dayTasks.filter((t) => t.done).length
    const completionRate = completedCount / dayTasks.length

    if (completionRate >= 0.75) {
      streak += 1
      currentDay = new Date(currentDay.getTime() - 24 * 60 * 60 * 1000)
    } else if (dayStr === todayString) {'''
          if old2 not in s:
              raise SystemExit('Expected current streak rule not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit streak rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blocksLogic.js
          git diff --cached --quiet && exit 0
          git commit -m "Update KYVO streak rule"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/update-kyvo-streak.yml
          git add .github/workflows/update-kyvo-streak.yml
          git diff --cached --quiet || (git commit -m "Remove temporary streak workflow" && git push)
